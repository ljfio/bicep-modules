name: Publish Bicep modules

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Module version tag (e.g. 1.0.0)'
        required: true
        default: '0.0.1'

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Check generated module files are up to date
        run: |
          python3 scripts/generate.py
          git diff --exit-code -- modules/naming/

      - name: Lint naming module
        run: bicep lint modules/naming/naming.bicep

      - name: Unit tests - evaluate naming functions against the golden file
        run: |
          bicep build-params tests/naming.test.bicepparam --outfile /tmp/naming.test.json
          python3 tests/compare.py /tmp/naming.test.json tests/naming.test.expected.json

      - name: Boundary test - module compiles into an ordinary ARM template
        run: bicep build tests/naming.test.bicep --stdout > /dev/null

      - name: Lint env module
        run: bicep lint modules/env/env.bicep

      - name: Unit tests - evaluate env functions against the golden file
        run: |
          bicep build-params tests/env.test.bicepparam --outfile /tmp/env.test.json
          python3 tests/compare.py /tmp/env.test.json tests/env.test.expected.json

      - name: Boundary test - env module compiles into an ordinary ARM template
        run: bicep build tests/env.test.bicep --stdout > /dev/null

      - name: Negative tests - invalid inputs fail at build time
        run: python3 tests/negative.py

  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi

      - name: Publish naming module
        run: |
          bicep publish modules/naming/naming.bicep \
            --target "br:ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bicep-modules/naming:$VERSION" \
            --documentation-uri "https://github.com/${GITHUB_REPOSITORY}/tree/main/modules/naming"

      - name: Publish env module
        run: |
          bicep publish modules/env/env.bicep \
            --target "br:ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bicep-modules/env:$VERSION" \
            --documentation-uri "https://github.com/${GITHUB_REPOSITORY}/tree/main/modules/env"
